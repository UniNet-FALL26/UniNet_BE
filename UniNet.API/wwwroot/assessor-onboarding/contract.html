<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Ký hợp đồng thẩm định | UniNet</title>
  <link rel="stylesheet" href="./onboarding.css">
  <script src="./contract.js" defer></script>
</head>
<body>
  <header class="brand"><span class="brand-mark" aria-hidden="true">U</span> UniNet</header>
  <main class="contract-main">
    <div class="intro"><h1>Hợp đồng thẩm định</h1><p id="version" class="muted"></p></div>
    <p id="message" role="status">Đang mở hợp đồng…</p>
    <section id="contract" class="card" hidden>
      <article id="document" aria-label="Hợp đồng và phụ lục"></article>
      <div class="actions"><button id="download" class="secondary" type="button">Tải PDF</button></div>
      <form id="sign">
        <label>Họ và tên người ký <input name="signedName" required maxlength="255" autocomplete="name"></label>
        <label class="agree"><input name="accepted" type="checkbox" required> <span id="statement"></span></label>
        <div class="actions"><button type="submit">Xác nhận ký hợp đồng</button></div>
      </form>
      <p id="signed" hidden></p>
    </section>
  </main>
</body>
</html>
