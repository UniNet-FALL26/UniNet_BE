services:
  portrait-worker:
    build: .
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      PORTRAIT_WORKER_TOKEN: ${PortraitWorker__Token:?Set PortraitWorker__Token in the BE .env file}
      U2NET_HOME: /models
      OMP_NUM_THREADS: "2"
    volumes:
      - portrait-models:/models
    restart: unless-stopped
volumes:
  portrait-models:
